
# Single container: the API is on loopback, so there is no DNS to resolve and
# no backend to re-resolve. The resolver directive from the multi-service
# config pointed at Docker's embedded DNS at 127.0.0.11, which does not exist
# in a single container -- nginx would start and every proxied request would
# fail to resolve, so it is removed rather than repointed.
#
# The upstream below is a literal 127.0.0.1:8000 rather than a variable. The
# multi-service config wraps it in `set $backend_upstream` only to defeat
# nginx's implicit URI substitution; with a fixed address proxy_pass can carry
# the path itself, and dropping the variable removes that subtlety.

server {
    # Inside the server block, not at file scope: conf.d/*.conf is included in
    # the http context, so a file-scope `server_tokens` here duplicates the one
    # the packaged nginx.conf already sets and nginx refuses to start.
    server_tokens off;

    # gzip* live here rather than at file scope for the same reason. Anything at
    # the top of a conf.d file lands in the http context, where the packaged
    # nginx.conf has already set several of them, and nginx then refuses to
    # start with `"gzip" directive is duplicate`. Both of these cost a boot
    # cycle to find, so they are grouped deliberately.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/geo+json image/svg+xml
               application/wasm model/gltf+json;

    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # LAS/LAZ, DXF, evidence PDFs. nginx default is 1m and returns 413.
    client_max_body_size 512m;
    client_body_timeout 300s;

    include /etc/nginx/snippets/security-headers.conf;

    # ---- API -----------------------------------------------------------
    # ^~ stops the static-file regex below from stealing /api/**/*.json etc.
    # That regex is matched ahead of plain prefix locations, so without ^~ a
    # request for /api/v1/tiles/meta.json was served from disk and 404'd even
    # though /api/v1/tiles/meta worked. It also hit /api/v1/lidar/.../x.bin and
    # any .las path. .pbf survived only by luck: pbf is not in the regex.
    location ^~ /api/ {
        set $backend_upstream 127.0.0.1:8000;
        # $request_uri is required: putting a variable in proxy_pass disables
        # nginx's implicit URI substitution, so the original path and query
        # have to be forwarded explicitly or every call 404s.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host, not $host: $host strips the port, and Starlette builds its
        # trailing-slash redirect from the Host header. With $host, GET
        # /api/v1/parcels answered "location: http://127.0.0.1/api/v1/parcels/"
        # - a URL pointing at the caller's own machine with no port, so
        # following the redirect never resolved. That silently made eight
        # endpoints unreachable for anything that did not happen to send the
        # trailing slash. $http_host preserves the port as the client sent it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        error_page 502 503 504 = @backend_down;
    }

    # Binary point streams: no buffering, no gzip (already dense floats).
    # Listed before the ^~ /api/ block it would never match, because ^~ stops
    # regex and prefix searching; nginx takes the longest matching ^~ prefix.
    location ^~ /api/v1/lidar/ {
        set $backend_upstream 127.0.0.1:8000;
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        gzip off;
        proxy_read_timeout 300s;
        error_page 502 503 504 = @backend_down;
    }

    location @backend_down {
        default_type application/json;
        return 503 '{"detail":"Backend unavailable. Retry shortly.","source":"nginx"}';
    }

    location = /health {
        set $backend_upstream 127.0.0.1:8000;
        proxy_pass http://$backend_upstream/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Static --------------------------------------------------------
    # Vite content-hashes everything under /assets/.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed public files (models, sample data): revalidate.
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|glb|gltf|bin|las|laz|json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA shell must never be cached, or deploys serve stale chunk names.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
