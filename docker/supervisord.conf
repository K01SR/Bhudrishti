; Supervisor config for the single-container image.
;
; All five processes share one container, so autorestart is the only thing
; standing between a crashed Postgres and a container that stays up serving
; 500s. The healthcheck in the Dockerfile only proves nginx answers /health,
; which proxies to the API; it does not prove Postgres is alive, so a wedged
; database will not trigger a restart. That is the main thing to watch if this
; image is used for anything long-lived.
;
; Priorities start Postgres and Redis first and the API last, so uvicorn comes
; up against a database that is already accepting connections. The entrypoint
; also waits for pg_isready, so this ordering is belt-and-braces rather than the
; only protection.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
priority=10
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save ""
user=root
priority=20
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
; Persistence is off deliberately: the database is Postgres, and a Redis dump
; file in a container filesystem is a second, silently stale copy of queue
; state that survives image rebuilds.

[program:api]
command=/usr/local/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app
priority=30
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
; Bound to loopback, not 0.0.0.0. nginx is the only thing that should reach
; the API, and the compose stack's 8000:8000 publish exists for debugging rather
; than as a supported entry point.

[program:worker]
command=/usr/local/bin/celery -A app.worker.celery_app worker --loglevel=info
directory=/app
priority=40
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
; The module path matches docker-compose.yml's worker command: celery_app lives
; in app/worker.py, and `-A app.worker.celery_app` is how you name the
; attribute within that module.

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=50
autorestart=true
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
