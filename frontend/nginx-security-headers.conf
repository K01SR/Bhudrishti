# Security headers, kept in one file because of an nginx inheritance rule that
# is easy to get wrong: add_header directives in a location block REPLACE every
# inherited add_header from the server level, they do not merge with them.
#
# So a location that sets its own Cache-Control silently loses all of these.
# Verified before the fix: /health and /api/ (which set no add_header of their
# own) returned all four, while / and /assets/ -- the SPA shell and the hashed
# bundles the browser actually loads -- returned only X-Content-Type-Options
# and X-Frame-Options, and dropped Referrer-Policy and Permissions-Policy.
#
# Include this in every location that also calls add_header.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
