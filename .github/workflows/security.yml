name: Bhu-Drishti 3D Security Scan

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secrets / Credentials Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  python-dependencies:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        # This step was `continue-on-error: true` and therefore never gated
        # anything. It reported 14 advisories in starlette 0.38.6 on every run
        # and nobody acted on them, because a report that cannot fail is not a
        # gate. The advisories are now fixed (fastapi>=0.142.0,<0.143.0 with an
        # explicit starlette>=1.3.1 pin), so this fails closed from a clean
        # baseline and a new advisory will break the build.
        #
        # The pinned fastapi range previously made every fix unreachable:
        # fastapi 0.114.2 requires starlette<0.39, so no patched version could
        # be installed. See the comment in backend/requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --desc on

  node-dependencies:
    name: Node Dependency Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Audit production Node dependencies
        # Policy: fail on High/Critical; report Med/Low in the log.
        #
        # This was `npm audit --omit=dev --audit-level=high || true`. The `|| true`
        # swallowed the exit code, so the `--audit-level=high` it was paired
        # with could never take effect: the step reported a critical advisory
        # and passed. The stated policy was not implemented.
        #
        # Gate is now scripts/audit_node_deps.py, which fails on any high or
        # critical advisory except a single explicitly accepted one, and only
        # while the reason it is unreachable still holds.
        working-directory: ./frontend
        run: python3 ../scripts/audit_node_deps.py